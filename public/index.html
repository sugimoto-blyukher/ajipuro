<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>アジプロジェネレーター</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./public/images/favicon.ico">
  <style>
    :root {
      --ink: #19150f;
      --muted-ink: #5c5041;
      --paper: #e9ddbd;
      --red: #a30d12;
      --dark-red: #65080b;
      --rule: #382f25;
      --gold: #d7b95d;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: #74090d;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(1rem, 4vw, 3.5rem) 1rem;
      color: var(--ink);
      font-family: "Yu Mincho", "游明朝", "YuMincho", "Hiragino Mincho ProN",
        "Hiragino Mincho Pro", "Noto Serif CJK JP", "Noto Serif JP", serif;
      line-height: 1.85;
      background-color: #74090d;
      background-image:
        linear-gradient(30deg, rgba(255,255,255,.025) 12%, transparent 12.5%, transparent 87%, rgba(255,255,255,.025) 87.5%),
        linear-gradient(150deg, rgba(255,255,255,.025) 12%, transparent 12.5%, transparent 87%, rgba(255,255,255,.025) 87.5%),
        radial-gradient(circle at 50% 0, #a20d13 0, #74090d 58%, #510508 100%);
      background-size: 48px 84px, 48px 84px, 100% 100%;
    }

    .newspaper {
      position: relative;
      width: min(100%, 960px);
      margin: 0 auto;
      padding: clamp(1.25rem, 4.5vw, 3.5rem);
      overflow: hidden;
      background-color: var(--paper);
      background-image:
        radial-gradient(circle at 18% 16%, rgba(111, 78, 38, .08) 0 1px, transparent 1.8px),
        radial-gradient(circle at 78% 63%, rgba(111, 78, 38, .07) 0 1px, transparent 1.5px),
        repeating-linear-gradient(0deg, rgba(74, 54, 31, .022) 0 1px, transparent 1px 4px),
        linear-gradient(100deg, rgba(255,255,255,.22), transparent 36%, rgba(92,62,25,.06));
      background-size: 31px 37px, 43px 47px, auto, auto;
      border: 1px solid #c6b78f;
      box-shadow: 0 18px 60px rgba(34, 0, 0, .48), inset 0 0 70px rgba(91, 64, 25, .12);
    }

    .newspaper::before {
      content: "";
      position: absolute;
      inset: 10px;
      pointer-events: none;
      border: 1px solid rgba(56, 47, 37, .28);
    }

    .masthead {
      position: relative;
      text-align: center;
      border-top: 5px solid var(--red);
      border-bottom: 3px double var(--rule);
    }

    .issue-line {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
      padding: .25rem 0;
      border-bottom: 1px solid var(--rule);
      color: var(--muted-ink);
      font-size: clamp(.66rem, 1.7vw, .78rem);
      font-weight: 700;
      letter-spacing: .12em;
    }

    .issue-line span:first-child { text-align: left; }
    .issue-line span:last-child { text-align: right; }

    .star {
      color: var(--red);
      font-size: 1rem;
    }

    h1 {
      margin: .22em 0 .08em;
      color: var(--red);
      font-size: clamp(2.35rem, 8vw, 5.7rem);
      font-weight: 900;
      letter-spacing: .05em;
      line-height: 1.05;
      text-shadow: 1px 1px 0 rgba(88, 37, 21, .18);
    }

    .subtitle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      margin: 0 0 .6rem;
      color: var(--dark-red);
      font-size: clamp(.72rem, 2vw, .9rem);
      font-weight: 700;
      letter-spacing: .3em;
    }

    .subtitle::before,
    .subtitle::after {
      content: "";
      width: clamp(2rem, 9vw, 6rem);
      height: 1px;
      background: var(--red);
    }

    .lead {
      margin: clamp(1.4rem, 4vw, 2.5rem) 0 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 6px double var(--rule);
      text-align: center;
    }

    .lead h2 {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 2.35rem);
      letter-spacing: .08em;
      line-height: 1.45;
    }

    .lead p {
      margin: .45rem 0 0;
      color: var(--muted-ink);
      font-size: .88rem;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .card {
      position: relative;
      margin-top: 1.5rem;
      padding: clamp(1rem, 3vw, 1.65rem);
      background: rgba(247, 238, 211, .52);
      border: 1px solid var(--rule);
      box-shadow: inset 0 0 0 4px rgba(233, 221, 189, .8), inset 0 0 0 5px rgba(56, 47, 37, .28);
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: .65rem;
      margin: 0 0 1rem;
      color: var(--red);
      font-size: clamp(1.15rem, 3vw, 1.5rem);
      font-weight: 900;
      letter-spacing: .12em;
      line-height: 1.4;
    }

    .section-heading::before {
      content: "★";
      font-size: .85em;
    }

    .label {
      display: block;
      margin-bottom: .4rem;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .14em;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      padding: .9rem 1rem;
      resize: vertical;
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
      line-height: 1.75;
      background: rgba(255, 252, 238, .72);
      border: 1px solid #6f6150;
      border-radius: 0;
      box-shadow: inset 2px 2px 7px rgba(69, 48, 25, .1);
    }

    textarea:focus {
      outline: 3px solid rgba(163, 13, 18, .25);
      border-color: var(--red);
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: .9rem;
    }

    .form-note {
      margin: 0;
      color: var(--muted-ink);
      font-size: .75rem;
      letter-spacing: .06em;
    }

    button {
      flex: 0 0 auto;
      padding: .7rem 1.5rem;
      cursor: pointer;
      color: #fff4d2;
      font-family: inherit;
      font-size: .92rem;
      font-weight: 700;
      letter-spacing: .15em;
      background: var(--red);
      border: 1px solid var(--dark-red);
      border-radius: 0;
      box-shadow: 3px 3px 0 var(--gold);
      transition: transform .15s ease, background-color .15s ease, box-shadow .15s ease;
    }

    button:hover {
      background: var(--dark-red);
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--gold);
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--gold);
    }

    button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    .result-card { border-top: 7px solid var(--red); }

    .result-box {
      min-height: 5rem;
      padding: 1rem 1.15rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: rgba(255, 252, 238, .62);
      border-top: 3px double var(--rule);
      border-bottom: 1px solid var(--rule);
      font-size: 1.02rem;
      line-height: 2;
    }

    .footer-rule {
      display: flex;
      align-items: center;
      gap: .7rem;
      margin-top: 2rem;
      color: var(--red);
    }

    .footer-rule::before,
    .footer-rule::after {
      content: "";
      flex: 1;
      height: 3px;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }

    @media (max-width: 600px) {
      body { padding: 0; }

      .newspaper {
        min-height: 100vh;
        border: 0;
      }

      .issue-line { grid-template-columns: 1fr auto; }
      .issue-line span:nth-child(2) { display: none; }

      .form-footer {
        align-items: stretch;
        flex-direction: column;
      }

      button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="newspaper">
    <header class="masthead">
      <div class="issue-line" aria-label="紙面情報">
        <span>共産趣味者のための機関紙</span>
        <span class="star" aria-hidden="true">★</span>
        <span>使用モデル：{{ model }}</span>
      </div>
      <h1>共産圏の新聞ジェネレーター</h1>
      <p class="subtitle">特別電子版</p>
    </header>

    <section class="lead" aria-labelledby="lead-heading">
      <h2 id="lead-heading">言葉を鍛え、力強い文章を生み出す</h2>
    </section>

    <section class="card" aria-labelledby="prompt-heading">
      <h2 class="section-heading" id="prompt-heading">編集指令</h2>
      <form method="post" action="/">
        <label class="label" for="prompt">生成する内容</label>
        <textarea id="prompt" name="prompt" placeholder="ここにプロンプトを記入してください" required>{{ prompt }}</textarea>
        <div class="form-footer">
          <p class="form-note">記入した指令をもとに、新たな原稿を生成します。</p>
          <button type="submit">原稿を生成する</button>
        </div>
      </form>
    </section>

    {% if result %}
    <section class="card result-card" aria-labelledby="result-heading">
      <h2 class="section-heading" id="result-heading">発表原稿</h2>
      <div class="result-box">{{ result }}</div>
    </section>
    {% endif %}

    <div class="footer-rule" aria-hidden="true"><span>★</span></div>
  </main>
</body>
</html>
