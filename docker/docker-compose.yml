services:
  fastapi:
    build:
      context: ..
      dockerfile: ./docker/fastapi/Dockerfile
    container_name: fastapi-app
    restart: always
    working_dir: /app
    tty: true
    ports:
      - "8080:8000"
    env_file:
      - ../.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload



